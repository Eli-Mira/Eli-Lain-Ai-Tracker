name: EliLain — Daily Free LLM Provider Audit

on:
  schedule:
    # 9 AM Cairo = 6 AM UTC (Cairo is UTC+3, no DST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if outside schedule'
        required: false
        type: boolean

jobs:
  run-elilain-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e "./src/tracker-core"
          pip install -e ".[dev]"

      - name: Run EliLain full audit
        env:
          # GitHub (for tool discovery)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Notifications (optional — only if you add them)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          NOTIFICATION_CHANNEL: ${{ secrets.NOTIFICATION_CHANNEL }}
        run: |
          python main.py audit --theme lain

      - name: Upload EliLain report
        uses: actions/upload-artifact@v4
        with:
          name: elain-report-${{ github.run_id }}
          path: reports/*.html
          retention-days: 14

      - name: Commit report to repo (optional history)
        if: always()
        run: |
          REPORT_FILE=$(ls reports/*.html | head -1)
          if [ -f "$REPORT_FILE" ]; then
            mkdir -p history
            cp "$REPORT_FILE" "history/elain_$(date +%Y%m%d).html"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add history/elain_$(date +%Y%m%d).html 2>/dev/null || true
            git diff --cached --quiet || git commit -m "EliLain report: $(date +%Y-%m-%d)" && git push
          fi