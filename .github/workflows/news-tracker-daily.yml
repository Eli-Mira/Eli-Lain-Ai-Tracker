name: EliLain — Daily Intel Audit

permissions:
  contents: read

concurrency:
  group: elilain-intel-daily
  cancel-in-progress: false

on:
  schedule:
    # Fixed UTC schedule; report check timestamps are timezone-aware.
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-elilain-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e "./src/tracker-core"
          pip install -e ".[dev]"

      - name: Restore discovery and news history
        uses: actions/cache@v4
        with:
          # These IDs are generated by GitHub, not untrusted event text.
          key: intel-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            intel-state-${{ runner.os }}-
          path: |
            data/intel_state.json
            data/provider_changes.json
            data/provider_state.json
            data/news.db
            data/health.json

      - name: Install Chromium for rendered-site tests
        run: python -m playwright install --with-deps chromium

      - name: Run regression tests
        run: python -m pytest tests -q

      - name: Run news tracker + EliLain audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NOTIFICATION_CHANNEL: ${{ secrets.NOTIFICATION_CHANNEL }}
        # 'today' fetches + stores news and pushes breaking items;
        # 'audit' refreshes discovery and renders providers + news + tools.
        # Probes are auto-skipped in CI (freellmapi runs locally on Mira).
        run: |
          python main.py today --theme lain
          python main.py audit --theme lain

      - name: Build sanitized public export
        # Regenerated from saved state only: writes exactly one public/index.html.
        run: python main.py export-public --public-dir ./public

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: elain-report-${{ github.run_id }}
          path: reports/*.html
          retention-days: 14

      - name: Upload sanitized public export as artifact
        uses: actions/upload-artifact@v4
        with:
          name: elain-public-${{ github.run_id }}
          path: public/index.html
          retention-days: 14

      # Hosting and both channel posts stay opt-in. A repository variable gates
      # this step because the `secrets` context is not available in a step-level
      # `if`; GitHub rejects the whole workflow file when it is used there.
      # Secrets reach the process through env only, never argv, and no event
      # text is ever interpolated into a run block.
      - name: Publish export and notify (opt-in via PUBLISH_ENABLED)
        if: ${{ vars.PUBLISH_ENABLED == 'true' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python main.py publish --public-dir ./public --no-export
