name: EliLain — Daily Free LLM Provider Audit

on:
  schedule:
    # 9 AM Cairo = 06:00 UTC (Cairo is UTC+3, no DST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-elilain-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e "./src/tracker-core"
          pip install -e ".[dev]"

      - name: Run news tracker + EliLain audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NOTIFICATION_CHANNEL: ${{ secrets.NOTIFICATION_CHANNEL }}
        # 'today' fetches + stores news and pushes breaking items;
        # 'report' regenerates the final HTML with providers + news + tools.
        # Probes are auto-skipped in CI (freellmapi runs locally on Mira).
        run: |
          python main.py today --theme lain
          python main.py report --theme lain

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: elain-report-${{ github.run_id }}
          path: reports/*.html
          retention-days: 14
