name: EliLain — Daily Intel Audit

permissions:
  contents: read

concurrency:
  group: elilain-intel-daily
  cancel-in-progress: false

on:
  schedule:
    # Fixed UTC schedule; report check timestamps are timezone-aware.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      publish_pages:
        description: 'Verify Pages publication once before enabling the daily flag'
        type: boolean
        required: false
        default: false

jobs:
  run-elilain-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e "./src/tracker-core"
          pip install -e ".[dev]"

      - name: Restore discovery and news history
        id: restore-intel
        uses: actions/cache/restore@v4
        with:
          # These IDs are generated by GitHub, not untrusted event text.
          key: intel-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            intel-state-${{ runner.os }}-
          # Every file the run reads or rewrites must be listed here. A missing
          # entry is a silent data loss: per-feed cooldowns reset daily and the
          # project evaluation is regenerated from scratch each run.
          path: |
            data/intel_state.json
            data/provider_changes.json
            data/provider_state.json
            data/project_evaluations.json
            data/delivery_receipts.json
            data/news.db
            data/health.json
            data/feed_health.json

      - name: Install Chromium for rendered-site tests
        run: python -m playwright install --with-deps chromium

      - name: Run regression tests
        run: python -m pytest tests -q

      - name: Run news tracker + EliLain audit
        id: refresh-intel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          # Email was removed from the channel list; its EMAIL_* secrets are
          # deleted. Injecting them here would only supply empty credentials.
          NOTIFICATION_CHANNEL: ${{ secrets.NOTIFICATION_CHANNEL }}
        # 'today' fetches + stores news and pushes breaking items;
        # 'audit' refreshes discovery and renders providers + news + tools.
        # Probes are auto-skipped in CI (freellmapi runs locally on Mira).
        run: |
          python main.py today --theme lain
          python main.py audit --theme lain

      - name: Build sanitized public export
        # Regenerated from saved state only: writes exactly one public/index.html.
        run: python main.py export-public --public-dir ./public

      - name: Validate sanitized single-file publication boundary
        # No network or credentials; fails before any public upload/deploy.
        run: python scripts/verify_pages_report.py --public-dir ./public --preflight-only

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: elain-report-${{ github.run_id }}
          path: reports/*.html
          retention-days: 14

      - name: Upload sanitized public export as artifact
        uses: actions/upload-artifact@v4
        with:
          name: elain-public-${{ github.run_id }}
          path: public/index.html
          retention-days: 14

      # Hosting and both channel posts stay opt-in. A repository variable gates
      # this step because the `secrets` context is not available in a step-level
      # `if`; GitHub rejects the whole workflow file when it is used there.
      # Secrets reach the process through env only, never argv, and no event
      # text is ever interpolated into a run block.
      # Manual input is a trusted boolean used only in `if`, never in shell.
      # Keep the daily flag off until a manual end-to-end verification succeeds.
      - name: Deploy sanitized file to Cloudflare Pages
        id: deploy-pages
        if: ${{ vars.CLOUDFLARE_PUBLISH_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_pages) }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.146.0'
          command: pages deploy ./public --project-name=eli-lain-intel --branch=main
          # No gitHubToken: deploys need no additional repository permissions.

      - name: Verify actual Pages bytes before notifications
        id: verify-pages
        if: ${{ steps.deploy-pages.outcome == 'success' }}
        run: python scripts/verify_pages_report.py --public-dir ./public

      - name: Publish export and notify (opt-in via PUBLISH_ENABLED)
        if: ${{ vars.PUBLISH_ENABLED == 'true' }}
        env:
          # Class-name-only failure diagnostics; never logs messages or URLs.
          DELIVERY_DEBUG: "1"
          # Cloudflare Pages is the only host. The publisher independently
          # re-verifies these exact bytes before any channel send.
          PUBLIC_REPORT_URL: ${{ steps.verify-pages.outputs.url }}
          # Netlify was removed as a host: its deploy credit ran out and it is
          # no longer contacted. The optional best-effort mirror stays off; set
          # NETLIFY_MIRROR_ENABLED=true and restore its two secrets to use it.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python main.py publish --public-dir ./public --no-export

      - name: Persist state including partial channel confirmations
        # Only trusted workflow step outcomes/runner-generated IDs are used.
        # A channel failure must not discard its sibling's confirmed receipt.
        if: ${{ always() && steps.restore-intel.outcome == 'success' && steps.refresh-intel.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          key: intel-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/intel_state.json
            data/provider_changes.json
            data/provider_state.json
            data/project_evaluations.json
            data/delivery_receipts.json
            data/news.db
            data/health.json
            data/feed_health.json
